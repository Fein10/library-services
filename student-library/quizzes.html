<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzes - Student Library Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">📚 Student Library</div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="library.html">Library</a></li>
                <li><a href="quizzes.html" class="active">Quizzes</a></li>
                <li><a href="results.html">My Results</a></li>
            </ul>
        </div>
    </nav>

    <div class="quiz-container">
        <div id="quizSelection" class="quiz-selection">
            <h1>Available Quizzes</h1>
            <p>Select a quiz to test your knowledge</p>
            <div class="quiz-list" id="quizList">
                <!-- Quizzes will be loaded here -->
            </div>
        </div>

        <div id="quizTaking" class="quiz-taking" style="display: none;">
            <div class="quiz-header">
                <h2 id="quizTitle"></h2>
                <div class="quiz-info">
                    <span id="questionCounter"></span>
                    <span id="timer">Time: <span id="timeDisplay">00:00</span></span>
                </div>
            </div>

            <div class="question-container">
                <div id="questionContent"></div>
                <div id="optionsContainer" class="options-container"></div>
            </div>

            <div class="quiz-navigation">
                <button id="prevBtn" onclick="previousQuestion()">← Previous</button>
                <button id="nextBtn" onclick="nextQuestion()">Next →</button>
                <button id="submitBtn" onclick="submitQuiz()" style="display: none;">Submit Quiz</button>
            </div>
        </div>

        <div id="quizResults" class="quiz-results" style="display: none;">
            <div class="results-card">
                <h2>Quiz Results</h2>
                <div class="score-display">
                    <div class="score-circle">
                        <span id="scorePercentage"></span>
                    </div>
                    <p id="scoreText"></p>
                </div>
                <div class="results-details">
                    <div class="result-stat">
                        <span class="stat-label">Correct Answers:</span>
                        <span id="correctCount" class="stat-value"></span>
                    </div>
                    <div class="result-stat">
                        <span class="stat-label">Incorrect Answers:</span>
                        <span id="incorrectCount" class="stat-value"></span>
                    </div>
                    <div class="result-stat">
                        <span class="stat-label">Time Taken:</span>
                        <span id="timeTaken" class="stat-value"></span>
                    </div>
                    <div class="result-stat">
                        <span class="stat-label">Grade:</span>
                        <span id="gradeDisplay" class="stat-value"></span>
                    </div>
                </div>
                <div id="reviewSection" class="review-section"></div>
                <div class="results-actions">
                    <button onclick="retakeQuiz()" class="btn btn-secondary">Retake Quiz</button>
                    <button onclick="backToQuizzes()" class="btn btn-primary">Back to Quizzes</button>
                    <button onclick="viewAllResults()" class="btn btn-secondary">View All Results</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Student Library Portal. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="quiz.js"></script>
</body>
</html>
